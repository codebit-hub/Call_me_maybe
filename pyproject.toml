[project]
name = "call-me-maybe"
version = "0.1.0"
description = "42 School - Introduction to function calling in LLMs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.14.0",
    "llm-sdk",
    "numpy>=2.0.0",
    "pydantic>=2.13.4",
    "torch>=2.4.0",
]

[tool.uv.sources]
llm-sdk = { path = "./llm_sdk" }

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true
exclude = ["llm_sdk", ".venv"]

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "mypy>=2.2.0",
]
